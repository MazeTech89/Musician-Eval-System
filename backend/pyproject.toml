[project]
name = "Musician-Eval-Backend"
version = "0.1.0"
description = "Backend for Musician Evaluation System"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "S", "UP"]
ignore = ["S101", "B008", "S104", "S105", "N805", "B904"]  # allow FastAPI/Pydantic patterns and tests

[tool.ruff.lint.per-file-ignores]
"app/api/v1/*.py" = ["B008"]
"app/core/dependencies.py" = ["B008"]
"app/core/security.py" = ["S105"]
"tests/**/*.py" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
