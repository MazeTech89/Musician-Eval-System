name: CD

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Run deploy stage after image build"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
  ECR_REPOSITORY_BACKEND: ${{ vars.ECR_REPOSITORY_BACKEND || 'musician-eval-backend' }}
  ECR_REPOSITORY_FRONTEND: ${{ vars.ECR_REPOSITORY_FRONTEND || 'musician-eval-frontend' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || '' }}
  ECS_SERVICE_BACKEND: ${{ vars.ECS_SERVICE_BACKEND || '' }}
  ECS_SERVICE_FRONTEND: ${{ vars.ECS_SERVICE_FRONTEND || '' }}
  ECS_BACKEND_CONTAINER_NAME: ${{ vars.ECS_BACKEND_CONTAINER_NAME || 'backend' }}
  ECS_FRONTEND_CONTAINER_NAME: ${{ vars.ECS_FRONTEND_CONTAINER_NAME || 'frontend' }}

jobs:
  build-and-push:
    name: Build and push container images
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY_BACKEND:$TAG" backend
          docker push "$REGISTRY/$ECR_REPOSITORY_BACKEND:$TAG"

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY_FRONTEND:$TAG" frontend
          docker push "$REGISTRY/$ECR_REPOSITORY_FRONTEND:$TAG"

      - name: Export image references
        id: images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          echo "backend_image=$REGISTRY/$ECR_REPOSITORY_BACKEND:$TAG" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$REGISTRY/$ECR_REPOSITORY_FRONTEND:$TAG" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'workflow_dispatch' || inputs.deploy == true
    steps:
      - name: Validate deploy configuration
        shell: bash
        run: |
          missing=0
          for key in ECS_CLUSTER ECS_SERVICE_BACKEND ECS_SERVICE_FRONTEND; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required repository variable: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Deploy backend service
        env:
          NEW_IMAGE: ${{ needs.build-and-push.outputs.backend_image }}
        shell: bash
        run: |
          current_td=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE_BACKEND" --query "services[0].taskDefinition" --output text)
          aws ecs describe-task-definition --task-definition "$current_td" --query taskDefinition > backend-td.json
          jq --arg image "$NEW_IMAGE" --arg cname "$ECS_BACKEND_CONTAINER_NAME" '
            .containerDefinitions |= map(if .name == $cname then .image = $image else . end)
            | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
          ' backend-td.json > backend-td-new.json
          new_td_arn=$(aws ecs register-task-definition --cli-input-json file://backend-td-new.json --query "taskDefinition.taskDefinitionArn" --output text)
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE_BACKEND" --task-definition "$new_td_arn"
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE_BACKEND"

      - name: Deploy frontend service
        env:
          NEW_IMAGE: ${{ needs.build-and-push.outputs.frontend_image }}
        shell: bash
        run: |
          current_td=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE_FRONTEND" --query "services[0].taskDefinition" --output text)
          aws ecs describe-task-definition --task-definition "$current_td" --query taskDefinition > frontend-td.json
          jq --arg image "$NEW_IMAGE" --arg cname "$ECS_FRONTEND_CONTAINER_NAME" '
            .containerDefinitions |= map(if .name == $cname then .image = $image else . end)
            | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
          ' frontend-td.json > frontend-td-new.json
          new_td_arn=$(aws ecs register-task-definition --cli-input-json file://frontend-td-new.json --query "taskDefinition.taskDefinitionArn" --output text)
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE_FRONTEND" --task-definition "$new_td_arn"
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE_FRONTEND"
