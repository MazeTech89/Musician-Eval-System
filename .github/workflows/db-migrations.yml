name: Database Migration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/db-migrations.yml"

jobs:
  migrate:
    name: Apply DB migrations/bootstrap
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: musician_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d musician_eval"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Detect migration strategy
        id: detect
        shell: bash
        run: |
          if [ -f "alembic.ini" ] && [ -d "migrations" ]; then
            echo "strategy=alembic" >> "$GITHUB_OUTPUT"
          else
            echo "strategy=bootstrap" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Alembic migrations
        if: steps.detect.outputs.strategy == 'alembic'
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/musician_eval
        run: alembic upgrade head

      - name: Run schema bootstrap
        if: steps.detect.outputs.strategy == 'bootstrap'
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/musician_eval
        run: python app/core/init_db.py
