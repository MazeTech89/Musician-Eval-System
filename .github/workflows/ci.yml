name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (Ruff)
        run: ruff check .

      - name: Format check (Ruff)
        run: ruff format --check .

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing

  docker-smoke:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Build and start test stack
        run: docker compose -f docker-compose.test.yml up -d --build

      - name: Verify backend health
        run: |
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8001/api/v1/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend health check failed"
          docker compose -f docker-compose.test.yml logs backend
          exit 1

      - name: Verify frontend
        run: |
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5174/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Frontend check failed"
          docker compose -f docker-compose.test.yml logs frontend
          exit 1

      - name: Show compose status on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml ps

      - name: Stop test stack
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes --remove-orphans
