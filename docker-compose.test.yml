name: musician-eval-test

services:
  postgres:
    image: postgres:15-alpine
    container_name: musician_eval_test_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: musician_eval_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d musician_eval_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: musician_eval_test_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: musician_eval_test_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://user:password@postgres:5432/musician_eval_test
      REDIS_URL: redis://redis:6379
      SECRET_KEY: test-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      DEBUG: "false"
      USE_LOCAL_UPLOAD_STORAGE: "true"
      LOCAL_UPLOAD_DIR: /app/uploads-test
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_test_uploads:/app/uploads-test

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: musician_eval_test_frontend
    environment:
      VITE_API_URL: http://localhost:8001/api/v1
    ports:
      - "5174:5173"
    depends_on:
      - backend

volumes:
  postgres_test_data:
  backend_test_uploads:
